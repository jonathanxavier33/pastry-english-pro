<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pastry English">
    <meta name="theme-color" content="#120f0d">
    <title>Pastry English Pro</title>
    
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧁</text></svg>">
    
    <style>
        :root {
            --bg-primary: #120f0d;
            --bg-secondary: #1e1916;
            --bg-card: #28211c;
            --bg-card-hover: #332a24;
            --fg-primary: #fbf9f7;
            --fg-secondary: #bbaea4;
            --fg-muted: #82756b;
            --accent: #e07a5f;
            --accent-glow: rgba(224,122,95,0.25);
            --success: #52796f;
            --success-glow: rgba(82,121,111,0.3);
            --error: #b75d5d;
            --error-glow: rgba(183,93,93,0.3);
            --border: #3d332c;
            --gold: #e9c46a;
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; 
            padding: 0; 
        }
        
        html, body {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, SF Pro Display, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--fg-primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow-x: hidden;
        }

        /* ACCUEIL MODERNISÉ */
        #home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
            background: 
                radial-gradient(circle at 10% 10%, rgba(224,122,95,0.12) 0%, transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(233,196,106,0.08) 0%, transparent 45%),
                var(--bg-primary);
        }

        .home-logo {
            font-size: 4rem;
            margin-bottom: 12px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        #home-screen h1 {
            font-size: clamp(1.8rem, 6vw, 2.4rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #fbf9f7, #bbaea4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { 
            color: var(--fg-secondary); 
            font-size: 0.95rem; 
            margin-bottom: 28px; 
            font-weight: 400;
        }

        .image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 340px;
            margin-bottom: 28px;
        }

        .image-grid img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            filter: brightness(0.9);
            transition: transform 0.3s ease;
        }

        .home-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 300px;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--accent), #d06548);
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: var(--radius-md);
            cursor: pointer;
            box-shadow: 0 8px 24px var(--accent-glow);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-main:active { transform: scale(0.97); }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--gold);
            border: 1px solid var(--border);
            padding: 14px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-secondary:hover { background: var(--bg-card-hover); }

        /* ÉCRAN JEU / EXAMEN */
        #game-screen { display: none; flex-direction: column; min-height: 100vh; }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px;
            padding-top: max(16px, env(safe-area-inset-top));
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 700;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--fg-secondary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover { background: var(--bg-card-hover); color: var(--fg-primary); }

        /* PROGRESSION */
        .progress-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .level-info { display: flex; align-items: center; gap: 10px; }
        .level-badge {
            background: rgba(224,122,95,0.15);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .level-name { font-weight: 700; font-size: 0.85rem; }
        .xp-count { font-weight: 700; color: var(--gold); font-size: 0.85rem; }

        .progress-track {
            width: 100%;
            background: var(--bg-secondary);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--gold));
            border-radius: 10px;
            transition: width 0.4s ease;
            width: 0%;
        }

        /* MENUS */
        .menu-container {
            display: flex;
            overflow-x: auto;
            padding: 10px 16px;
            gap: 8px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
            flex-shrink: 0;
        }

        .menu-container::-webkit-scrollbar { display: none; }

        .chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--fg-secondary);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .chip.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* ZONE CENTRALE DE JEU */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            justify-content: space-between;
        }

        .card-stage {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            min-height: 280px;
        }

        .card-category-tag {
            position: absolute;
            top: 16px;
            left: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--gold);
            text-transform: uppercase;
        }

        .audio-btn {
            position: absolute;
            top: 14px;
            right: 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--gold);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .audio-btn:active { transform: scale(0.9); }

        .card-main-word {
            font-size: clamp(1.8rem, 6vw, 2.4rem);
            font-weight: 800;
            color: var(--fg-primary);
            margin: 12px 0;
            line-height: 1.2;
        }

        .card-sub-info {
            font-size: 0.95rem;
            color: var(--fg-secondary);
            font-style: italic;
            margin-top: 8px;
            min-height: 28px;
        }

        .tap-hint {
            margin-top: 16px;
            font-size: 0.75rem;
            color: var(--fg-muted);
            background: var(--bg-secondary);
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        /* QUIZ */
        .quiz-container { width: 100%; margin-top: 16px; }
        .quiz-prompt { font-size: 0.9rem; color: var(--fg-secondary); margin-bottom: 12px; font-weight: 500; }
        .quiz-options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .quiz-option-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--fg-primary);
            padding: 16px 12px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 60px;
        }

        .quiz-option-btn:active:not(:disabled) { transform: scale(0.97); }
        .quiz-option-btn.correct { background: var(--success); border-color: var(--success); color: white; }
        .quiz-option-btn.wrong { background: var(--error); border-color: var(--error); color: white; }
        .quiz-option-btn:disabled { cursor: default; }

        /* REMÉDIATION */
        .remediation-box {
            background: var(--bg-secondary);
            border-left: 4px solid var(--gold);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 14px;
            margin-top: 14px;
            text-align: left;
            font-size: 0.85rem;
        }

        .remediation-title { font-weight: 700; color: var(--gold); margin-bottom: 4px; }

        /* CONTRÔLES BAS DE PAGE */
        .controls-stage { width: 100%; }
        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #d06548);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: var(--radius-md);
            cursor: pointer;
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        /* EXAMEN & IA */
        .exam-instructions {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-bottom: 12px;
            text-align: left;
            font-size: 0.85rem;
            color: var(--fg-secondary);
            line-height: 1.4;
        }

        .writing-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            text-align: left;
            margin-bottom: 12px;
        }

        .writing-textarea {
            width: 100%;
            min-height: 120px;
            background: transparent;
            border: none;
            color: var(--fg-primary);
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        .ai-card {
            background: linear-gradient(135deg, rgba(224,122,95,0.08), rgba(233,196,106,0.05));
            border: 1px solid var(--accent);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-top: 14px;
            text-align: left;
        }

        .ai-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 700; color: var(--accent); }
        .error-highlight { background: rgba(183,93,93,0.3); color: #ff9999; padding: 1px 4px; border-radius: 4px; text-decoration: line-through; }
        .correction-highlight { background: rgba(82,121,111,0.4); color: #85e3b0; padding: 1px 4px; border-radius: 4px; font-weight: 600; }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--fg-muted); border-radius: 50%; border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
